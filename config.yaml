# Label for the Hyperion version being benchmarked. This is only used to name
# the output directory, e.g. v1.0.0b2 (or v1.0.0b2_fast for the fast profile).
version: "v1.0.0b2"

# Number of MPI processes to use for each Hyperion run. This can be a number,
# or "all" to use all the cores available to Snakemake, which is all the cores
# on the machine unless --cores is given.
mpi_processes: all

# Settings that control the cost of the runs. The profile to use is selected
# on the command line with e.g. --config profile=fast, and defaults to full.
#
# In each profile, temperatures gives the settings for computing the
# temperatures of each model. The other runs re-use these temperatures:
# seds_monochromatic gives the numbers of photons for computing the SEDs at the
# benchmark wavelengths in monochromatic mode, and seds_binned for computing
# them in the normal (non-monochromatic) mode, with the SEDs binned in
# wavelength and interpolated to the benchmark wavelengths (the number of
# imaging photons for these is the total over all wavelengths).
profiles:

  # The settings used for the published benchmark results.
  full:
    temperatures:
      grid: [499, 399]
      n_initial_iterations: 10
      n_photons:
        initial: 10_000_000
    seds_monochromatic:
      n_photons:
        imaging_sources: 100_000
        imaging_dust: 100_000
        raytracing_sources: 1_000_000
        raytracing_dust: 1_000_000
    seds_binned:
      n_photons:
        imaging: 10_000_000
        raytracing_sources: 1_000_000
        raytracing_dust: 1_000_000

  # Much cheaper settings that are only intended to check that the whole
  # workflow runs. The results are noisy and the temperatures are not
  # converged, so they should not be used to judge the agreement with the
  # other codes.
  fast:
    temperatures:
      grid: [99, 79]
      n_initial_iterations: 2
      n_photons:
        initial: 100_000
    seds_monochromatic:
      n_photons:
        imaging_sources: 2_000
        imaging_dust: 2_000
        raytracing_sources: 10_000
        raytracing_dust: 10_000
    seds_binned:
      n_photons:
        imaging: 200_000
        raytracing_sources: 10_000
        raytracing_dust: 10_000
